[package]
name = "controllerindicator"
version = "0.1.0"
edition = "2024"
# Edition 2024 alone would say 1.85, but the code uses let-chains and
# `slice::as_chunks`, both of which landed in 1.88. Verified with `cargo +1.88.0
# check --all-targets`.
rust-version = "1.88"

[dependencies]
anyhow = "1"
bitflags = "2"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
# `windows` 0.62 gates the whole Win32 surface behind one feature per top level
# namespace; the leaf names (`Win32_Devices_Hid` and friends) are gone.
#
# Everything we call lives in these, and the real module paths turned out to be:
#   XInput        -> Win32::UI::Input::XboxController
#   hid.dll       -> Win32::Devices::HumanInterfaceDevice
#   setupapi.dll  -> Win32::Devices::DeviceAndDriverInstallation
#   gdi32.dll     -> Win32::Graphics::Gdi
windows = { version = "0.62", features = [
    "Win32_Foundation",
    # setupapi.dll: SetupDi* enumeration
    "Win32_Devices_DeviceAndDriverInstallation",
    # hid.dll: HidD_*, HidP_*
    "Win32_Devices_HumanInterfaceDevice",
    # SP_DEVICE_INTERFACE_DETAIL_DATA_W
    "Win32_Devices_Properties",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    # XInput lives here in 0.62, not under Win32::Gaming
    "Win32_UI_Input",
    "Win32_UI_Input_XboxController",
    "Win32_UI_WindowsAndMessaging",
] }
