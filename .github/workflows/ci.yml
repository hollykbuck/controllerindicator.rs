name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an in-flight run for the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Windows only: everything in this crate talks to Win32, so there is nothing
    # meaningful to check on another platform.
    name: fmt, clippy, test, build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Both of these are gates rather than reports. A formatting diff and a new
      # clippy lint should fail the build, not scroll past it.
      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Release build
        run: cargo build --release

  msrv:
    # The floor declared in Cargo.toml. `cargo check` is enough here: the point is
    # to catch a newer std API creeping in, not to test the compiler.
    name: MSRV (1.85)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.85.0

      - uses: Swatinem/rust-cache@v2

      - name: Check against the declared minimum
        run: cargo check --all-targets
